services:
  # ==========================================
  # Service Backend (FastAPI + TiDB + Python)
  # ==========================================
  - type: web
    name: credisense-backend
    runtime: python
    region: frankfurt # ou oregon, selon votre proximité
    plan: free
    buildCommand: pip install -r requirements.txt && python init_db_tidb.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false # Collez ici l'URL de connexion TiDB Cloud Serverless (mysql+pymysql://...)
      - key: SECRET_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5-20251001
      - key: DIFY_API_KEY
        sync: false
      - key: DIFY_API_URL
        value: https://api.dify.ai/v1
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: DEMANDES_EMAIL_DESTINATAIRE
        sync: false

  # ==========================================
  # Service Frontend (React + Vite + SPA)
  # ==========================================
  - type: web
    name: credisense-frontend
    runtime: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      # Règle impérative pour le routage client React Router (SPA)
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # Indiquez ici l'URL HTTPS générée par Render pour credisense-backend
